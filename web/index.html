    <meta charset="UTF-8" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />

  <body style="background-color: #0B0B0E; margin: 0;">
    <script>
      // Bersihkan Service Worker & Cache Storage lama agar selalu memuat build terbaru
      (function () {
        const APP_BUILD_VERSION = "2026-10-25-v3";
        try {
          if (localStorage.getItem("drayve_build_ver") !== APP_BUILD_VERSION) {
            localStorage.setItem("drayve_build_ver", APP_BUILD_VERSION);
            if ("serviceWorker" in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                for (let reg of regs) {
                  reg.unregister();
                }
              });
            }
            if ("caches" in window) {
              caches.keys().then(function (names) {
                for (let name of names) {
                  caches.delete(name);
                }
              });
            }
          }
        } catch (e) {}
      })();
    </script>
    <script src="flutter_bootstrap.js?v=20261025v3" async></script>
  </body>
